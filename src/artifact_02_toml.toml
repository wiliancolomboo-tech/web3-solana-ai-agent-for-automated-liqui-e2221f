[package]
name = "kinetic-vault"
version = "0.1.0"
description = "Solana AI Agent Dynamic Kinetic CLMM Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kinetic_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
solana-program = "=1.18.26"