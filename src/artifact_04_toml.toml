[package]
name = "kinetic_rebalance"
version = "0.1.0"
description = "Solana CLMM Kinetic Volatility Rebalancing Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kinetic_rebalance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["mint", "token", "associated_token"] }