[package]
name = "kinetix"
version = "0.1.0"
description = "Autonomous Kinetic-Volatility Liquidity Rebalancer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kinetix"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }
pyth-sdk-solana = "0.10.0"